name: IT 뉴스 노션 업로드

on:
  schedule:
    - cron: "0 8 * * 2"  # 매주 화요일 08:00 UTC = 17:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스 수집 및 노션 업로드
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python it-news-notion/main.py
